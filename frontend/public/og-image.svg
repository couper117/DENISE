<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#006B3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004d2b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C8972A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8b84b;stop-opacity:1" />
    </linearGradient>
    <!-- Fabric texture pattern -->
    <pattern id="weave" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <path d="M0 10 L20 10" stroke="#ffffff" stroke-width="0.3" opacity="0.08"/>
      <path d="M10 0 L10 20" stroke="#ffffff" stroke-width="0.3" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#weave)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="url(#gold)"/>

  <!-- Right decorative circles -->
  <circle cx="980" cy="315" r="260" fill="#ffffff" fill-opacity="0.04"/>
  <circle cx="980" cy="315" r="200" fill="#ffffff" fill-opacity="0.04"/>
  <circle cx="980" cy="315" r="140" fill="#ffffff" fill-opacity="0.05"/>

  <!-- Top-left subtle circle -->
  <circle cx="80" cy="80" r="120" fill="#C8972A" fill-opacity="0.08"/>

  <!-- D letterform decorative -->
  <text x="820" y="430" font-family="Georgia, serif" font-size="480" font-weight="700" fill="#ffffff" fill-opacity="0.05">D</text>

  <!-- Gold top rule -->
  <rect x="80" y="120" width="120" height="4" fill="url(#gold)" rx="2"/>

  <!-- Brand name -->
  <text x="80" y="280" font-family="Georgia, 'Times New Roman', serif" font-size="120" font-weight="700" fill="#ffffff" letter-spacing="12">DENISE</text>

  <!-- Underline accent -->
  <rect x="80" y="296" width="520" height="3" fill="url(#gold)" rx="1.5"/>

  <!-- Subtitle -->
  <text x="80" y="360" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#ffffff" fill-opacity="0.85" letter-spacing="6">NEW TEXTILE SOCIAL COMPANY LIMITED</text>

  <!-- Tagline -->
  <text x="80" y="430" font-family="Georgia, serif" font-size="32" font-style="italic" fill="#C8972A">Dress Your World With Extraordinary Textiles</text>

  <!-- Rwanda badge -->
  <rect x="80" y="490" width="220" height="44" rx="22" fill="#C8972A" fill-opacity="0.2"/>
  <rect x="80" y="490" width="220" height="44" rx="22" fill="none" stroke="#C8972A" stroke-width="1.5"/>
  <text x="190" y="518" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#C8972A" text-anchor="middle" letter-spacing="2">🇷🇼  KIGALI, RWANDA</text>

  <!-- Domain pill -->
  <rect x="80" y="550" width="200" height="36" rx="18" fill="#ffffff" fill-opacity="0.12"/>
  <text x="180" y="573" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#ffffff" fill-opacity="0.9" text-anchor="middle" letter-spacing="1">deniseshop.com</text>

  <!-- Bottom-right product categories -->
  <text x="920" y="220" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.6" text-anchor="middle" letter-spacing="2">CURTAINS</text>
  <text x="920" y="260" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#C8972A" text-anchor="middle">✦</text>
  <text x="920" y="300" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.6" text-anchor="middle" letter-spacing="2">FABRICS</text>
  <text x="920" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#C8972A" text-anchor="middle">✦</text>
  <text x="920" y="380" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.6" text-anchor="middle" letter-spacing="2">TRADITIONAL ATTIRE</text>
  <text x="920" y="420" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#C8972A" text-anchor="middle">✦</text>
  <text x="920" y="460" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.6" text-anchor="middle" letter-spacing="2">ACCESSORIES</text>

  <!-- Bottom bar -->
  <rect x="0" y="610" width="1200" height="20" fill="#000000" fill-opacity="0.25"/>
</svg>
